<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#0EA5E9;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="buildingFavGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F8FAFC;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#faviconGradient)"/>
  
  <!-- Hotel Building -->
  <g transform="translate(16, 16)">
    <!-- Main building -->
    <rect x="-8" y="-4" width="16" height="12" fill="url(#buildingFavGradient)" rx="1" stroke="#E2E8F0" stroke-width="0.5"/>
    
    <!-- Roof -->
    <polygon points="-10,-4 0,-12 10,-4" fill="#E11D48"/>
    
    <!-- Windows -->
    <rect x="-6" y="-2" width="2.5" height="2.5" fill="#3B82F6" rx="0.5" opacity="0.8"/>
    <rect x="-2" y="-2" width="2.5" height="2.5" fill="#3B82F6" rx="0.5" opacity="0.8"/>
    <rect x="2" y="-2" width="2.5" height="2.5" fill="#3B82F6" rx="0.5" opacity="0.8"/>
    
    <rect x="-6" y="2" width="2.5" height="2.5" fill="#3B82F6" rx="0.5" opacity="0.8"/>
    <rect x="-2" y="2" width="2.5" height="2.5" fill="#3B82F6" rx="0.5" opacity="0.8"/>
    <rect x="2" y="2" width="2.5" height="2.5" fill="#3B82F6" rx="0.5" opacity="0.8"/>
    
    <!-- Door -->
    <rect x="-1" y="6" width="2" height="2" fill="#1F2937" rx="0.3"/>
    
    <!-- Hotel sign -->
    <rect x="-4" y="-9" width="8" height="2" fill="#1F2937" rx="0.3" opacity="0.9"/>
    
    <!-- Decorative stars -->
    <circle cx="-12" cy="-8" r="1" fill="#FCD34D" opacity="0.8"/>
    <circle cx="12" cy="-8" r="1" fill="#FCD34D" opacity="0.8"/>
  </g>
</svg>
